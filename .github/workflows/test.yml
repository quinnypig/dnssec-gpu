name: CPU correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.12'
          python-version: '3.12'
      - name: CPU correctness, retained signatures and evidence binding
        run: make evidence
      - name: Retain sanitized check receipts
        if: always() && hashFiles('.fleet-evidence/release.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: experiment-evidence-${{ github.sha }}-${{ github.run_id }}
          path: .fleet-evidence/*.json
          include-hidden-files: true
          retention-days: 14
